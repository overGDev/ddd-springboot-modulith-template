; Minimal example: PgBouncer in front of Postgres for this project, using
; transaction pooling mode - the mode that actually reduces the number of
; real connections Postgres has to hold open across multiple app instances.
; See docs/scaling.md for when to actually introduce this, and why it
; requires disabling server-side prepared statements (prepareThreshold=0)
; on the application side.

[databases]
ddd_template = host=127.0.0.1 port=5432 dbname=ddd_template

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; transaction: a real Postgres connection is only held for the duration of
; one transaction, then returned to the pool for another client. This is
; what breaks server-side prepared statements across clients - see
; docs/scaling.md.
pool_mode = transaction

; Real connections PgBouncer keeps open to Postgres per database. Tune
; based on Postgres's max_connections and how many other things (migrations,
; admin sessions) also need to connect directly.
default_pool_size = 20
max_client_conn = 200

auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
