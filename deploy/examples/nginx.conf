# Minimal example: Nginx load balancing across multiple instances of this
# Spring Boot app. See docs/scaling.md for when to actually introduce this.
#
# Adjust the upstream server list to match however many instances you run
# (different ports on one host, or different hosts entirely).

upstream ddd_template_app {
    # least_conn favors instances with fewer active connections; drop this
    # line to fall back to plain round-robin.
    least_conn;

    server 127.0.0.1:8081;
    server 127.0.0.1:8082;
    server 127.0.0.1:8083;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://ddd_template_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
